<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PatientCurve Revenue Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: call cockpit. Step rail (left) → working sheet (centre) → live "money found" ledger (right). Stacks on phones. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f6f9f8;
  --ink: #12211f;
  --muted: #5a6b68;
  --line: #d6dfdc;
  --accent: #0b7a6a;
  --accent-soft: #dcefeb;
  --money: #a8620b;
  --money-soft: #fbefd9;
  --leak: #c0392b;
  --leak-soft: #fbe3df;
  --ok: #217a3c;
  --ok-soft: #dff1e4;
  --warn: #9a6b00;
  --warn-soft: #fbf0cf;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1514; --surface: #15201e; --surface-2: #1b2826; --ink: #e5eeec; --muted: #93a6a2;
    --line: #2a3a37; --accent: #3fc1aa; --accent-soft: #163a34; --money: #e9a945; --money-soft: #3a2c14;
    --leak: #ef7b6c; --leak-soft: #3d1f1b; --ok: #6bcf88; --ok-soft: #173321; --warn: #e3b84d; --warn-soft: #3a3115;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1514; --surface: #15201e; --surface-2: #1b2826; --ink: #e5eeec; --muted: #93a6a2;
  --line: #2a3a37; --accent: #3fc1aa; --accent-soft: #163a34; --money: #e9a945; --money-soft: #3a2c14;
  --leak: #ef7b6c; --leak-soft: #3d1f1b; --ok: #6bcf88; --ok-soft: #173321; --warn: #e3b84d; --warn-soft: #3a3115;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 0 48px;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, input[type="number"] { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 19px; font-weight: 700; }
.brand h1 span { color: var(--accent); }
.clinic-pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.clinic-pick select { max-width: 220px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--leak); color: var(--leak); }
.btn.sm { padding: 4px 9px; font-size: 13px; }

.sample-note {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 14px; margin-top: 14px; font-size: 14px;
}
.sample-note strong { color: var(--warn); }

/* Shell */
.shell {
  display: grid; gap: 20px; margin-top: 18px;
  grid-template-columns: 210px minmax(0, 1fr) 300px; align-items: start;
  max-width: 1440px; margin-inline: auto;
}
@media (max-width: 1180px) { .shell { grid-template-columns: 190px minmax(0, 1fr); } .ledger { grid-column: 1 / -1; } }
@media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* Step rail */
.rail { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
.rail button {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center;
  text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  color: var(--muted);
}
.rail button .n {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line);
  display: grid; place-items: center; font: 500 12px var(--f-mono); background: var(--surface);
}
.rail button .t { font-weight: 500; font-size: 14px; }
.rail button .d { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.rail button.done .d { background: var(--ok); }
.rail button:hover { background: var(--surface); color: var(--ink); }
.rail button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button.on .n { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.rail .principle {
  margin-top: 14px; padding: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
.rail .principle b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 15px; margin-bottom: 4px; }
@media (max-width: 760px) {
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail button { grid-template-columns: 22px auto; flex: 0 0 auto; }
  .rail button .d, .rail .principle { display: none; }
}

/* Sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; min-width: 0; }
@media (max-width: 520px) { .sheet { padding: 16px; } }
.step-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
.step-head h2 { font-size: 28px; font-weight: 700; margin-top: 6px; }
.step-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.step-body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; }
@media (max-width: 980px) { .step-body { grid-template-columns: minmax(0, 1fr); } }
.work { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.ask { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; align-self: start; }
.ask h3 { font-size: 15px; margin-bottom: 8px; }
.ask ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ask label { display: block; margin-top: 14px; }
.ask textarea { min-height: 110px; }

.group { display: flex; flex-direction: column; gap: 10px; }
.group > h3 { font-size: 17px; font-weight: 700; }
.group > .hint { margin: -6px 0 0; color: var(--muted); font-size: 13.5px; }
.fields { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--muted); }
.field.wide { grid-column: 1 / -1; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px;
}
textarea { resize: vertical; min-height: 64px; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
.money-in { position: relative; }
.money-in::before { content: "₹"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
.money-in input { padding-left: 24px; }
.pct-in { position: relative; }
.pct-in::after { content: "%"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
.pct-in input { padding-right: 26px; }

.callout { border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.callout.money { background: var(--money-soft); border-color: transparent; }
.callout.leak { background: var(--leak-soft); border-color: transparent; }
.callout.ok { background: var(--ok-soft); border-color: transparent; }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout b.big { font: 600 22px/1.2 var(--f-mono); display: block; margin-top: 2px; }

.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat .v { font: 600 20px/1.2 var(--f-mono); margin-top: 6px; }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 0; }
.f-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 90px; gap: 12px; align-items: center; padding: 6px 0; }
.f-row .lbl { font-weight: 500; font-size: 14px; }
.f-row .bar-wrap { height: 30px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.f-row .bar { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; transition: width .25s ease; }
.f-row input { text-align: right; }
.f-gap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 2px 0; }
.f-gap .conv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.f-gap .conv .pctv { font: 600 13px var(--f-mono); color: var(--ink); }
.f-gap .tgt { display: inline-flex; align-items: center; gap: 4px; }
.f-gap .tgt input { width: 64px; padding: 2px 6px; font-size: 13px; }
@media (max-width: 560px) {
  .f-row { grid-template-columns: 1fr 96px; }
  .f-row .bar-wrap { grid-column: 1 / -1; grid-row: 2; height: 18px; }
  .f-gap { grid-template-columns: 1fr; }
  .f-gap > span:first-child { display: none; }
}
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.leak { background: var(--leak-soft); color: var(--leak); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.money { background: var(--money-soft); color: var(--money); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td input { min-width: 80px; }
td input.name { min-width: 150px; }
tfoot td { font-weight: 600; background: var(--surface-2); }

/* Systems */
.sys-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); }
.sys { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.sys:last-child { border-bottom: 0; }
.sys .nm { font-weight: 500; font-size: 14px; }
.sys .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on[data-v="none"] { background: var(--leak-soft); color: var(--leak); font-weight: 600; }
.seg button.on[data-v="manual"] { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.seg button.on[data-v="auto"] { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.seg.score button { min-width: 30px; padding: 4px 8px; font-family: var(--f-mono); }
.seg.score button.on { background: var(--accent); color: var(--surface); font-weight: 600; }
@media (max-width: 520px) { .sys { grid-template-columns: 1fr; } }

/* Opportunities */
.opps { display: flex; flex-direction: column; gap: 12px; }
.opp { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px 14px; }
.opp.top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opp .rank { font: 700 22px/1 var(--f-display); color: var(--muted); padding-top: 2px; }
.opp.top .rank { color: var(--accent); }
.opp .title { font-weight: 600; font-size: 15.5px; }
.opp .why { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.opp .chips .pill { white-space: normal; }
.opp .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.opp .val { text-align: right; }
.opp .val .m { font: 600 19px/1.2 var(--f-mono); color: var(--money); }
.opp .val .y { font-size: 12.5px; color: var(--muted); }
.opp .val .sc { margin-top: 6px; font: 500 12px var(--f-mono); color: var(--muted); }
.opp .factors { grid-column: 2 / -1; display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.opp .factors .f { display: flex; flex-direction: column; gap: 4px; }
.opp .factors .f > span { font-size: 12px; color: var(--muted); }
.opp.excluded { opacity: .55; }
@media (max-width: 560px) {
  .opp { grid-template-columns: 28px minmax(0, 1fr); }
  .opp .val { grid-column: 2; text-align: left; }
  .opp .factors { grid-column: 1 / -1; }
}

/* Decision */
.story { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); counter-reset: s; }
.story .card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface-2); }
.story .card .eyebrow { display: block; margin-bottom: 6px; }
.story .card p { margin: 0; font-size: 14px; }
.verdict { border-radius: 14px; padding: 18px 20px; background: var(--accent-soft); display: grid; gap: 6px; }
.verdict h3 { font-size: 22px; }
.verdict .pos { font-size: 14.5px; }
.summary-box { font: 13px/1.55 var(--f-mono); white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; max-height: 360px; overflow: auto; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.step-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }

/* Ledger */
.ledger { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1180px) { .ledger { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.lcard.found { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lcard.found .eyebrow { color: var(--bg); opacity: .7; }
.lcard.found .big { font: 600 30px/1.1 var(--f-mono); margin-top: 8px; color: var(--money-soft); }
.lcard.found .sub { font-size: 13px; opacity: .8; margin-top: 4px; }
.gapbar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 25%, transparent); margin-top: 12px; overflow: hidden; }
.gapbar i { display: block; height: 100%; background: var(--money); border-radius: 4px; }
.lrow { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow span:first-child { color: var(--muted); }
.lrow span:last-child { font-family: var(--f-mono); font-weight: 500; text-align: right; }
.lcard h3 { font-size: 15px; margin-bottom: 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 50;
}
.modal-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; padding: 20px; width: min(560px, 100%); display: flex; flex-direction: column; gap: 12px; }
.modal textarea { min-height: 180px; font: 12.5px var(--f-mono); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="eyebrow">PatientCurve · Revenue Intelligence</span>
    <h1>Revenue <span>Diagnostic</span></h1>
  </div>
  <div class="clinic-pick">
    <label class="eyebrow" for="clinicSelect">Clinic</label>
    <select id="clinicSelect" aria-label="Saved clinics"></select>
    <button class="btn primary" id="newClinic" type="button">New clinic</button>
    <button class="btn" type="button" data-report="1">Download report</button>
    <button class="btn" id="exportBtn" type="button">Export</button>
    <button class="btn" id="importBtn" type="button">Import</button>
    <button class="btn ghost danger" id="deleteBtn" type="button">Delete</button>
  </div>
</header>

<div class="sample-note" id="sampleNote" hidden>
  <span><strong>Sample clinic.</strong> These figures are illustrative, taken from the strategy document. Start a new clinic before the call.</span>
  <button class="btn sm" type="button" id="sampleNew">Start a new clinic</button>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Diagnostic steps"></nav>
  <main class="sheet" id="sheet"></main>
  <aside class="ledger" id="ledger" aria-label="Live summary"></aside>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Import</h3>
    <p id="modalText" style="margin:0;color:var(--muted);font-size:14px"></p>
    <textarea id="modalArea" aria-label="Clinic data"></textarea>
    <input type="file" id="modalFile" accept="application/json,.json">
    <div class="row-btns" style="justify-content:flex-end">
      <button class="btn" type="button" id="modalCancel">Close</button>
      <button class="btn primary" type="button" id="modalOk">Import</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- Formatting ---------- */
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
function inr(v, opts = {}) {
  v = Math.round(n(v));
  const s = v < 0 ? "−" : ""; const a = Math.abs(v);
  if (a >= 1e7) return s + "₹" + trim(a / 1e7, 2) + " Cr";
  if (a >= 1e5) return s + "₹" + trim(a / 1e5, 1) + "L";
  return s + "₹" + a.toLocaleString("en-IN");
}
function trim(x, d) { return Number(x.toFixed(d)).toLocaleString("en-IN", { maximumFractionDigits: d }); }
const pct = (v, d = 0) => (Number.isFinite(v) ? (v * 100).toFixed(d) + "%" : "—");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ratio = (a, b) => (n(b) > 0 ? n(a) / n(b) : NaN);

/* ---------- Model ---------- */
const SYSTEMS = [
  ["enquiry", "New enquiry handling", "Who answers, how fast, after hours?", "lead"],
  ["whatsapp", "WhatsApp conversations", "Shared inbox or a personal phone?", "lead"],
  ["calls", "Calls", "Missed calls tracked and called back?", "lead"],
  ["booking", "Appointment booking", "Online, phone, walk-in?", "noshow"],
  ["reminders", "Reminders", "Day-before and same-day confirmation?", "noshow"],
  ["noshow", "No-show recovery", "Same-day reschedule attempt?", "noshow"],
  ["txfollow", "Treatment follow-up", "Undecided patients contacted after consult?", "acceptance"],
  ["recall", "Recall", "6-month hygiene and check-up recalls?", "reactivation"],
  ["reactivation", "Patient reactivation", "Lapsed patients ever contacted?", "reactivation"],
  ["referrals", "Referrals", "Asked for, tracked, rewarded?", "referral"],

function getPath(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) {
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}

/* ---------- Calculations ---------- */
function calc(s) {
  const f = s.funnel, r = {};
  r.stages = [["Enquiries", "enq"], ["Appointments booked", "appt"], ["Consultations attended", "consult"], ["Treatment plans accepted", "accepted"], ["Treatment starts", "starts"]];
  r.convNames = ["Enquiry → appointment", "Appointment → consultation", "Consultation → plan accepted", "Plan accepted → treatment start"];
  r.convIds = ["lead", "noshow", "acceptance", "start"];
  const vals = r.stages.map(([, k]) => n(f[k]));
  r.vals = vals;
  r.conv = [1, 2, 3, 4].map(i => ratio(vals[i], vals[i - 1]));
  r.tgt = [n(f.t1), n(f.t2), n(f.t3), n(f.t4)].map(x => x / 100);
  r.atv = n(f.atv);
  r.newRev = vals[4] * r.atv;
  r.gain = r.conv.map((c, i) => (Number.isFinite(c) && c > 0 && c < r.tgt[i] && vals[4] > 0 ? vals[4] * (r.tgt[i] / c - 1) * r.atv : 0));
  r.leakIdx = r.gain.reduce((b, g, i) => (g > (r.gain[b] || 0) ? i : b), -1);
  if (r.leakIdx >= 0 && r.gain[r.leakIdx] <= 0) r.leakIdx = -1;
  r.consultToStart = ratio(vals[4], vals[2]);

  // Database
  const d = s.db;
  r.dbReact = n(d.inactive) * n(d.reactRate) / 100 * n(d.retVal);
  r.dbRecall = n(d.overdue) * n(d.recallRate) / 100 * n(d.retVal);
  r.dbPending = (n(d.pending) + n(d.incomplete)) * n(d.pendRate) / 100 * r.atv;
  r.dbPool = r.dbReact + r.dbRecall + r.dbPending;
  const months = Math.max(1, n(d.months) || 12);
  r.dbMonths = months;
  const extraRefs = Math.max(0, n(d.refTarget) - n(d.refNow));
  r.refGain = extraRefs * (Number.isFinite(r.consultToStart) ? r.consultToStart : 0.4) * r.atv;

  // Treatments
  const lift = n(s.hvLift) / 100;
  r.tx = s.treatments.map(t => {
    const c = n(t.consults), st = Math.min(n(t.starts), c || n(t.starts)), v = n(t.value);
    const acc = ratio(st, c);
    const extra = c > 0 ? Math.max(0, Math.min(c, st + c * lift) - st) * v : 0;
    return { name: t.name, c, st, v, acc, rev: st * v, extra };
  });
  r.txRev = r.tx.reduce((a, t) => a + t.rev, 0);
  r.txGain = r.tx.reduce((a, t) => a + t.extra, 0);

  // Capacity
  const cp = s.capacity;
  r.slots = n(cp.chairs) * n(cp.hours) * 60 / Math.max(5, n(cp.slot) || 30) * n(cp.days);
  r.util = r.slots > 0 ? n(cp.booked) / r.slots : NaN;
  r.capVerdict = !Number.isFinite(r.util) ? "unknown" : r.util < 0.7 ? "under" : r.util < 0.85 ? "balanced" : "full";
  const spare = Math.max(0, r.slots * 0.85 - n(cp.booked));
  r.spareSlots = spare;
  r.acqGain = r.capVerdict === "under" ? (spare / Math.max(1, n(cp.visits) || 4)) * 0.5 * r.atv : 0;

  // Systems gaps per opportunity
  r.gaps = {};
  SYSTEMS.forEach(([k, label, , opp]) => {
    const st = s.systems[k];
    if (opp === "all") return;
    const ids = opp === "acceptance" ? ["acceptance", "start", "highvalue", "pending"] : [opp];
    ids.forEach(id => { if (st === "none" || st === "manual") (r.gaps[id] = r.gaps[id] || []).push({ label, st }); });
  });

  // Opportunities
  const raw = [
    { id: "lead", m: r.gain[0], why: whyConv(r, 0) },
    { id: "noshow", m: r.gain[1], why: whyConv(r, 1) },
    { id: "acceptance", m: r.gain[2], why: whyConv(r, 2) },
    { id: "start", m: r.gain[3], why: whyConv(r, 3) },
    { id: "reactivation", m: (r.dbReact + r.dbRecall) / months, why: `${fmtN(d.inactive)} inactive and ${fmtN(d.overdue)} overdue-recall patients. Pool of ${inr(r.dbReact + r.dbRecall)} worked over ${months} months.` },
    { id: "pending", m: r.dbPending / months, why: `${fmtN(n(d.pending) + n(d.incomplete))} planned or unfinished treatments at ${d.pendRate || 0}% recovery. Pool of ${inr(r.dbPending)} over ${months} months.` },
    { id: "highvalue", m: r.txGain, why: `+${s.hvLift || 0} points acceptance on high-value treatments. Overlaps with treatment acceptance follow-up.` },
    { id: "referral", m: r.refGain, why: `${fmtN(extraRefs)} more referred patients a month (from ${fmtN(d.refNow)} to ${fmtN(d.refTarget)}).` },
    { id: "acquisition", m: r.acqGain, why: r.capVerdict === "under" ? `${fmtN(Math.round(spare))} spare appointment slots a month at ${pct(r.util)} utilisation. Value assumes half are filled.` : "Only worth pursuing once capacity is under-used and the funnel converts." },
  ];
  const maxM = Math.max(1, ...raw.map(o => o.m));
  r.opps = raw.map(o => {
    const def = OPP_DEFS[o.id];
    const sc = Object.assign({}, def.d, (s.scores || {})[o.id] || {});
    let cap;
    if (r.capVerdict === "unknown") cap = 3;
    else if (def.demand) cap = r.capVerdict === "under" ? 5 : r.capVerdict === "balanced" ? 3 : 1;
    else cap = r.capVerdict === "full" ? 3 : 4;
    const rev = 1 + 4 * (o.m / maxM);
    const score = o.m <= 0 ? 0 : (0.35 * rev + 0.15 * sc.confidence + 0.15 * (6 - sc.cost) + 0.15 * sc.speed + 0.10 * (6 - sc.difficulty) + 0.10 * cap);
    return Object.assign({}, o, def, { sc, cap, score, excluded: !!(s.excluded || {})[o.id], gaps: r.gaps[o.id] || [] });
  }).sort((a, b) => (a.excluded - b.excluded) || (b.score - a.score));
  r.active = r.opps.filter(o => !o.excluded && o.m > 0);
  r.top = r.active[0] || null;
  // Money found = recoverable leakage only; acquisition needs new spend, so it is ranked but kept out of the total.
  // Combined total: funnel leaks compound, so count the largest funnel leak plus database/referral/acquisition; highvalue overlaps acceptance.
  const funnelBest = Math.max(0, ...r.active.filter(o => ["lead", "noshow", "acceptance", "start", "highvalue"].includes(o.id)).map(o => o.m));
  const funnelSum = r.active.filter(o => ["lead", "noshow", "acceptance", "start"].includes(o.id)).reduce((a, o) => a + o.m, 0);
  const other = r.active.filter(o => ["reactivation", "pending", "referral"].includes(o.id)).reduce((a, o) => a + o.m, 0);
  r.totalCons = funnelBest + other;
  r.totalAll = Math.max(funnelSum, funnelBest) + other;

  r.curRev = n(s.goal.cur); r.desRev = n(s.goal.des);
  r.goalGap = Math.max(0, r.desRev - r.curRev);
  return r;
}
function whyConv(r, i) {
  const c = r.conv[i];
  if (!Number.isFinite(c)) return "Enter the funnel numbers to size this.";
  return `${r.convNames[i]} at ${pct(c)} vs ${pct(r.tgt[i])} target.`;
}
function fmtN(v) { return Math.round(n(v)).toLocaleString("en-IN"); }

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);
let R = null;

function field(path, label, opts = {}) {
  const v = getPath(S(), path) ?? "";
  const type = opts.type || "number";
  const wrap = opts.money ? "money-in" : opts.pct ? "pct-in" : "";
  const id = "f_" + path.replace(/\./g, "_");
  let input;
  if (type === "textarea") input = `<textarea id="${id}" data-k="${path}" placeholder="${esc(opts.ph || "")}">${esc(v)}</textarea>`;
  else if (type === "select") input = `<select id="${id}" data-k="${path}">${opts.options.map(([ov, ol]) => `<option value="${ov}"${ov === v ? " selected" : ""}>${esc(ol)}</option>`).join("")}</select>`;
  else input = `<input id="${id}" type="${type}" data-k="${path}" value="${esc(v)}" ${type === "number" ? 'inputmode="decimal" min="0" step="any"' : ""} placeholder="${esc(opts.ph || "")}">`;
  return `<label class="field${opts.wide ? " wide" : ""}" for="${id}"><span>${esc(label)}</span>${wrap ? `<div class="${wrap}">${input}</div>` : input}</label>`;
}

function renderRail() {
  const s = S();
  const done = [
    n(s.goal.cur) > 0 && n(s.goal.des) > 0,
    n(s.funnel.enq) > 0 && n(s.funnel.starts) > 0 && n(s.funnel.atv) > 0,
    n(s.db.total) > 0,
    s.treatments.some(t => n(t.consults) > 0),
    n(s.capacity.chairs) > 0 && n(s.capacity.booked) > 0,
    Object.keys(s.systems).length >= 6,
    R.active.length > 0,
    !!s.decision.next && !!(s.decision.when || s.decision.who),
  ];
  $("rail").innerHTML = STEPS.map((st, i) =>
    `<button type="button" data-step="${i}" class="${i === store.step ? "on" : ""} ${done[i] ? "done" : ""}" aria-current="${i === store.step ? "step" : "false"}">
      <span class="n">${i + 1}</span><span class="t">${esc(st.t)}</span><span class="d" title="${done[i] ? "Captured" : ""}"></span></button>`).join("") +
    `<div class="principle"><b>Find money first.</b>Diagnose before selling. Then decide what system can recover that money.</div>`;
}

/* Live refresh: update computed parts without touching inputs (keeps focus while typing) */

  R = calc(S());

  }

    if (box) box.innerHTML = `<div class="callout ${V[0]}"><span class="eyebrow">Decision rule</span><b class="big" style="font-family:var(--f-display);font-size:19px">${V[1]}</b>${V[2]}</div>`;

const LEAK_TEXT = [

const FACTORS = [["confidence", "Confidence in evidence", "low → high"], ["cost", "Implementation cost", "low → high"], ["speed", "Speed to results", "slow → fast"], ["difficulty", "Execution difficulty", "easy → hard"]];

function multipleProblems() {
  if (R.active.length < 3) return false;
  const top = R.active[0].m;
  const diags = new Set(R.active.filter(o => o.m >= top * 0.35).slice(0, 4).map(o => o.diag));
  return diags.size >= 3;
}
function renderDecision() {
  const s = S(), v = $("verdict"); if (!v) return;
  const t = R.top;
  if (!t) { v.innerHTML = `<div class="callout">Complete the funnel, database and capacity steps to get a recommendation.</div>`; $("story").innerHTML = ""; $("summary").textContent = buildSummary(); return; }
  const multi = multipleProblems();
  const iv = multi ? "Revenue operating system" : t.iv;
  const diag = multi ? "Multiple problems" : t.diag;
  const capture = n(s.decision.capture) / 100;
  const top3 = R.active.slice(0, 3);
  v.innerHTML = `<div class="verdict">
    <span class="eyebrow">Diagnosis: ${esc(diag)}</span>
    <h3>${esc(iv)}</h3>
    <div class="pos">Start with <b>${esc(t.t.toLowerCase())}</b>: ${esc(t.pc)}.${multi ? ` Then layer in ${esc(top3.slice(1).map(o => o.t.toLowerCase()).join(" and "))}.` : ""}</div>
    <div class="pos" style="color:var(--muted)">PatientCurve helps dental clinics recover and grow revenue from the patient journey, from enquiry to appointment, treatment and reactivation.</div>
  </div>`;
  const gapCover = R.goalGap ? R.totalCons / R.goalGap : NaN;
  $("story").innerHTML = [
    ["Current situation", `${inr(R.curRev)}/month${s.goal.trend ? ", " + s.goal.trend : ""}. Goal ${inr(R.desRev)}/month${s.goal.timeline ? " in " + esc(s.goal.timeline) : ""}. ${fmtN(R.vals[0])} enquiries → ${fmtN(R.vals[4])} starts a month.`],

    ["Solution", esc(t.pc) + "."],

function buildSummary() {
  const s = S(), c = s.clinic, d = s.decision;
  const L = [];
  L.push(`REVENUE DIAGNOSTIC: ${c.name || "Unnamed clinic"}${c.city ? " (" + c.city + ")" : ""}`);
  L.push(`Call date: ${c.date || "-"} | Decision maker: ${c.contact || "-"}`);
  L.push("");
  L.push(`GOAL: ${inr(R.curRev)}/mo now -> ${inr(R.desRev)}/mo target${s.goal.timeline ? " in " + s.goal.timeline : ""} (gap ${inr(R.goalGap)}/mo)`);
  if (s.goal.reason) L.push(`Why: ${s.goal.reason}`);
  L.push("");
  L.push("FUNNEL (monthly):");
  R.stages.forEach(([lbl], i) => L.push(`  ${lbl}: ${fmtN(R.vals[i])}${i > 0 ? `  (${pct(R.conv[i - 1])} vs ${pct(R.tgt[i - 1])} target)` : ""}`));
  L.push(`  Average treatment value: ${inr(R.atv)}`);
  if (R.leakIdx >= 0) L.push(`  Biggest leak: ${R.convNames[R.leakIdx]} = ${inr(R.gain[R.leakIdx])}/mo`);
  L.push("");
  L.push(`DATABASE: ${fmtN(s.db.total)} total, ${fmtN(s.db.inactive)} inactive, ${fmtN(s.db.overdue)} overdue recalls, ${fmtN(n(s.db.pending) + n(s.db.incomplete))} pending/incomplete. Pool ~${inr(R.dbPool)}.`);
  L.push(`CAPACITY: ${pct(R.util)} chair utilisation (${R.capVerdict}).`);
  const gaps = SYSTEMS.filter(([k]) => s.systems[k] === "none").map(([, l]) => l);
  if (gaps.length) L.push(`NO PROCESS FOR: ${gaps.join(", ")}`);
  if (s.tried) L.push(`ALREADY TRIED: ${s.tried}`);
  L.push("");
  L.push("RANKED OPPORTUNITIES (per month):");
  R.active.forEach((o, i) => L.push(`  ${i + 1}. ${o.t}: ${inr(o.m)} (score ${o.score.toFixed(2)})`));
  L.push(`  Recoverable total (excl. new marketing): ${inr(R.totalCons)}/mo, ${inr(R.totalCons * 12)}/yr`);
  L.push("");
  if (R.top) {
    const multi = multipleProblems();
    L.push(`RECOMMENDATION: ${multi ? "Revenue operating system" : R.top.iv}, starting with ${R.top.t}.`);
    L.push(`  ${R.top.pc}.`);
  }
  const NEXT = { call2: "Book Call 2: revenue opportunity", pilot: "Start a pilot", proposal: "Send proposal", data: "Need more data from clinic", nofit: "Not a fit right now" };
  L.push(`NEXT STEP: ${NEXT[d.next] || "-"}${d.when ? " on " + d.when : ""}${d.who ? " with " + d.who : ""}`);
  if (d.budget) L.push(`Budget: ${d.budget}`);
  if (d.objections) L.push(`Objections: ${d.objections}`);
  const notes = STEPS.filter(st => (s.notes || {})[st.id]).map(st => `  [${st.t}] ${s.notes[st.id]}`);
  if (notes.length) { L.push(""); L.push("NOTES:"); L.push(...notes); }
  return L.join("\n");
}

      <div class="lrow"><span>Chair utilisation</span><span>${pct(R.util)} · ${capTxt}</span></div>
    </div>
    <div class="lcard"><h3>Top opportunities</h3>
      ${R.active.slice(0, 4).map((o, i) => `<div class="lrow"><span>${i + 1}. ${esc(o.t)}</span><span>${inr(o.m)}</span></div>`).join("") || `<div class="lrow"><span>Fill in the funnel to rank</span><span></span></div>`}
      ${R.top ? `<div style="margin-top:10px"><span class="pill accent">Lead with: ${esc(R.top.iv)}</span></div>` : ""}
    </div>
    <div class="lcard"><h3>Funnel</h3>
      ${vals.map((v, i) => `<div style="display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;margin:3px 0">
        <div style="height:10px;border-radius:3px;background:var(--surface-2)"><div style="height:100%;width:${v / max * 100}%;border-radius:3px;background:${R.leakIdx >= 0 && i === R.leakIdx + 1 ? "var(--leak)" : "var(--accent)"}"></div></div>
        <span class="num" style="font:500 12px var(--f-mono);text-align:right">${fmtN(v)}</span></div>`).join("")}
    </div>`;
}

function renderClinicSelect() {
  const ids = Object.keys(store.clinics);
  $("clinicSelect").innerHTML = ids.map(id => `<option value="${id}"${id === store.current ? " selected" : ""}>${esc(store.clinics[id].clinic.name || "Unnamed clinic")}</option>`).join("");
  $("sampleNote").hidden = !S().sample;
}
function renderAll() { R = calc(S()); renderClinicSelect(); renderRail(); renderSheet(); }

/* ---------- Events ---------- */
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  const v = e.target.type === "number" ? (e.target.value === "" ? "" : Number(e.target.value)) : e.target.value;
  setPath(S(), k, v);
  if (k === "clinic.name") renderClinicSelect();
  if (k === "db.total" || k === "db.active") autoFillInactive();
  save(); refreshLive(); renderRail();
});
let inactiveTouched = false;
function autoFillInactive() {
  const d = S().db; if (inactiveTouched) return;
  if (n(d.total) > 0 && n(d.active) > 0 && document.activeElement && document.activeElement.dataset.k !== "db.inactive") {
    d.inactive = Math.max(0, n(d.total) - n(d.active));
    const el = $("f_db_inactive"); if (el) el.value = d.inactive;
  }
}
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.k === "db.inactive") inactiveTouched = true; });

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.step != null) { go(+t.dataset.step); return; }
  if (t.dataset.go != null) { go(+t.dataset.go); return; }
  if (t.dataset.sys) {
    const s = S(); s.systems[t.dataset.sys] = s.systems[t.dataset.sys] === t.dataset.v ? undefined : t.dataset.v;
    t.parentElement.querySelectorAll("button").forEach(b => { const on = s.systems[t.dataset.sys] === b.dataset.v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    save(); refreshLive(); renderRail(); return;
  }
  if (t.dataset.score) {
    const s = S(); s.scores = s.scores || {}; s.scores[t.dataset.score] = s.scores[t.dataset.score] || {};
    s.scores[t.dataset.score][t.dataset.f] = +t.dataset.v; save(); refreshLive(); return;
  }
  if (t.dataset.excl) { const s = S(); s.excluded = s.excluded || {}; s.excluded[t.dataset.excl] = !s.excluded[t.dataset.excl]; save(); refreshLive(); renderRail(); return; }
  if (t.dataset.delTx != null) { S().treatments.splice(+t.dataset.delTx, 1); save(); renderSheet(); return; }
  if (t.id === "addTx") { S().treatments.push({ name: "", consults: "", starts: "", value: "" }); save(); renderSheet(); const i = S().treatments.length - 1; const el = $("tx_n_" + i); if (el) el.focus(); return; }
  if (t.dataset.report) { downloadReport(t); return; }
  if (t.id === "copySummary") { copy(buildSummary(), "Summary copied"); return; }
});
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  store.step = i; save(); renderRail(); renderSheet();
  const top = $("sheet").getBoundingClientRect().top + window.scrollY - 80;
  if (window.scrollY > top) window.scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

$("clinicSelect").addEventListener("change", e => { store.current = e.target.value; inactiveTouched = false; save(); renderAll(); });
function newClinic() {
  const id = "c" + Date.now(); store.clinics[id] = blankState(); store.current = id; store.step = 0; inactiveTouched = false;
  save(); renderAll(); const el = $("f_clinic_name"); if (el) el.focus(); toast("New clinic started");
}
$("newClinic").addEventListener("click", newClinic);
$("sampleNew").addEventListener("click", newClinic);

let pendingDelete = 0;
$("deleteBtn").addEventListener("click", () => {
  const btn = $("deleteBtn");
  if (Date.now() - pendingDelete > 4000) { pendingDelete = Date.now(); btn.textContent = "Click again to delete"; setTimeout(() => { btn.textContent = "Delete"; }, 4000); return; }
  pendingDelete = 0; btn.textContent = "Delete";
  delete store.clinics[store.current];
  const ids = Object.keys(store.clinics);
  if (ids.length) store.current = ids[ids.length - 1];
  else { const id = "c" + Date.now(); store.clinics[id] = sampleState(); store.current = id; }
  store.step = 0; save(); renderAll(); toast("Clinic deleted");
});

/* Export / import */
const modal = $("modal");
let modalMode = "import";
$("exportBtn").addEventListener("click", () => {
  modalMode = "export";
  $("modalTitle").textContent = "Export clinic data";
  $("modalText").textContent = "Copy this JSON into your CRM or notes. Paste it into Import on any device to continue.";
  $("modalArea").value = JSON.stringify(S(), null, 2);
  $("modalFile").hidden = true; $("modalOk").textContent = "Copy JSON";
  modal.hidden = false; $("modalArea").select();
});
$("importBtn").addEventListener("click", () => {
  modalMode = "import";
  $("modalTitle").textContent = "Import clinic data";
  $("modalText").textContent = "Paste exported JSON, or choose a .json file. It is added as a new clinic.";
  $("modalArea").value = ""; $("modalFile").hidden = false; $("modalFile").value = ""; $("modalOk").textContent = "Import";
  modal.hidden = false; $("modalArea").focus();
});
$("modalFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { $("modalArea").value = rd.result; }; rd.readAsText(f);
});
$("modalCancel").addEventListener("click", () => { modal.hidden = true; });
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) modal.hidden = true; });
$("modalOk").addEventListener("click", () => {
  if (modalMode === "export") { copy($("modalArea").value, "JSON copied"); return; }
  try {
    const data = JSON.parse($("modalArea").value);
    if (!data || typeof data !== "object" || !data.funnel || !data.clinic) throw new Error("shape");
    const base = blankState();
    const merged = Object.assign(base, data, { sample: false });
    ["clinic", "goal", "funnel", "db", "capacity", "decision"].forEach(k => { merged[k] = Object.assign(blankState()[k], data[k] || {}); });
    const id = "c" + Date.now(); store.clinics[id] = merged; store.current = id; store.step = 0;
    save(); renderAll(); modal.hidden = true; toast("Clinic imported");
  } catch (err) { $("modalText").textContent = "That is not exported clinic JSON. Export from this page, then paste the whole block."; }
});

function copy(text, msg) {
  const done = () => toast(msg);
  try {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, msg));
  } catch (e) { fallbackCopy(text, msg); }
}
function fallbackCopy(text, msg) {
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  toast(ok ? msg : "Copy blocked: select the text and copy it manually");
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

/* ---------- Branded PDF report ---------- */
// Standard PDF fonts cannot draw ₹ or arrows, so the report spells currency as "Rs".
const P = s => String(s ?? "").replace(/₹/g, "Rs ").replace(/→/g, "->").replace(/−/g, "-").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x00-\xFF–—•]/g, "");
const inrP = v => P(inr(v));
const C = { accent: [11, 122, 106], ink: [18, 33, 31], muted: [90, 107, 104], line: [214, 223, 220], soft: [220, 239, 235], money: [168, 98, 11], moneySoft: [251, 239, 217], leak: [192, 57, 43], leakSoft: [251, 227, 223], paper: [246, 249, 248] };

function buildReportPdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const s = S(), c = s.clinic, d = s.decision;
  const W = 210, M = 16, CW = W - 2 * M;
  let y = 0;
  const color = (k, fn = "setTextColor") => doc[fn](...C[k]);
  const ensure = h => { if (y + h > 280) { doc.addPage(); y = 20; } };
  const heading = (txt, sub) => {
    ensure(22); y += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); color("ink"); doc.text(P(txt), M, y);
    if (sub) { doc.setFont("helvetica", "normal"); doc.setFontSize(9); color("muted"); doc.text(P(sub), W - M, y, { align: "right" }); }
    y += 2.5; doc.setDrawColor(...C.accent); doc.setLineWidth(0.6); doc.line(M, y, M + 14, y); y += 5;
  };
  const para = (txt, size = 10, col = "ink") => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(size); color(col);
    const lines = doc.splitTextToSize(P(txt), CW); ensure(lines.length * size * 0.42 + 2);
    doc.text(lines, M, y); y += lines.length * size * 0.42 + 2;
  };
  const table = (head, body, opts = {}) => {
    doc.autoTable(Object.assign({
      startY: y, head: [head.map(P)], body: body.map(r => r.map(P)), margin: { left: M, right: M },
      theme: "plain", styles: { font: "helvetica", fontSize: 9, cellPadding: 2.2, textColor: C.ink, lineColor: C.line, lineWidth: { bottom: 0.2 } },
      headStyles: { fillColor: C.paper, textColor: C.muted, fontStyle: "bold", fontSize: 8 },
    }, opts, {
      didParseCell: h => {
        const cs = (opts.columnStyles || {})[h.column.index];
        if (h.section === "head" && cs && cs.halign) h.cell.styles.halign = cs.halign;
        if (opts.didParseCell) opts.didParseCell(h);
      },
    }));
    y = doc.lastAutoTable.finalY + 6;
  };

  // Cover band
  doc.setFillColor(...C.ink); doc.rect(0, 0, W, 46, "F");
  doc.setFillColor(...C.accent); doc.rect(0, 46, W, 1.6, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(255, 255, 255);
  doc.text("PatientCurve", M, 14);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(170, 205, 198);
  doc.text("REVENUE INTELLIGENCE", M + doc.getTextWidth("PatientCurve") * 11 / 8.5 + 3, 14);
  doc.setFont("helvetica", "bold"); doc.setFontSize(21); doc.setTextColor(255, 255, 255);
  doc.text("Revenue Opportunity Report", M, 28);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(214, 232, 228);
  doc.text(P(`${c.name || "Clinic"}${c.city ? " · " + c.city : ""}`).replace("·", "-"), M, 37);
  doc.setFontSize(8.5); doc.setTextColor(170, 205, 198);
  const meta = [c.date ? "Diagnostic call: " + c.date : "", c.contact ? "Prepared for: " + c.contact : "", d.rep ? "Prepared by: " + d.rep : ""].filter(Boolean).join("   |   ");
  doc.text(P(meta), M, 42.5);
  y = 58;

  // Headline numbers
  const boxW = (CW - 8) / 3, boxH = 25;
  const cover = R.goalGap ? R.totalCons / R.goalGap : NaN;
  [
    ["RECOVERABLE REVENUE", inrP(R.totalCons) + " /mo", inrP(R.totalCons * 12) + " a year", "moneySoft", "money"],
    ["REVENUE GOAL", R.desRev ? inrP(R.desRev) + " /mo" : "-", R.curRev ? "from " + inrP(R.curRev) + " /mo today" : "", "paper", "ink"],
    ["SHARE OF GOAL GAP", Number.isFinite(cover) ? pct(cover) : "-", R.goalGap ? "of the " + inrP(R.goalGap) + " /mo gap" : "", "soft", "accent"],
  ].forEach(([lbl, big, sub, bg, fg], i) => {
    const x = M + i * (boxW + 4);
    doc.setFillColor(...C[bg]); doc.roundedRect(x, y, boxW, boxH, 2, 2, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7); color("muted"); doc.text(lbl, x + 4, y + 6);
    doc.setFontSize(15); color(fg); doc.text(big, x + 4, y + 15);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); color("muted"); doc.text(sub, x + 4, y + 21);
  });
  y += boxH + 6;
  para("Recoverable revenue comes from the clinic's existing enquiries, patients and database, without new marketing spend. Overlapping opportunities are counted once.", 8.5, "muted");

  // Diagnosis
  const multi = multipleProblems();
  if (R.top) {
    const iv = multi ? "Revenue operating system" : R.top.iv;
    const diag = multi ? "Multiple revenue leaks" : R.top.diag;
    const body = `Start with ${R.top.t.toLowerCase()}: ${R.top.pc}.` + (multi ? ` Then add ${R.active.slice(1, 3).map(o => o.t.toLowerCase()).join(" and ")}.` : "");
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    const lines = doc.splitTextToSize(P(body), CW - 10);
    const h = 18 + lines.length * 4.4;
    ensure(h + 4);
    doc.setFillColor(...C.soft); doc.roundedRect(M, y, CW, h, 2, 2, "F");
    doc.setFillColor(...C.accent); doc.rect(M, y, 1.4, h, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); color("accent"); doc.text(P("DIAGNOSIS: " + diag.toUpperCase()), M + 6, y + 6.5);
    doc.setFontSize(13.5); color("ink"); doc.text(P(iv), M + 6, y + 13);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(lines, M + 6, y + 19);
    y += h + 6;
  }

  // Funnel
  heading("Patient revenue funnel", "per month");
  const fBody = R.stages.map(([lbl], i) => {
    if (i === 0) return [lbl, fmtN(R.vals[0]), "", "", ""];
    const j = i - 1, cv = R.conv[j];
    return [lbl, fmtN(R.vals[i]), pct(cv), pct(R.tgt[j]), R.gain[j] > 0 ? inrP(R.gain[j]) : "On target"];
  });
  table(["Stage", "Volume", "Conversion", "Target", "Revenue leak / mo"], fBody, {
    columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } },
    didParseCell: h => { if (h.section === "body" && R.leakIdx >= 0 && h.row.index === R.leakIdx + 1) { h.cell.styles.fillColor = C.leakSoft; if (h.column.index === 4) { h.cell.styles.textColor = C.leak; h.cell.styles.fontStyle = "bold"; } } },
  });
  para(`Average treatment value ${inrP(R.atv)}. New-patient treatment revenue ${inrP(R.newRev)} a month; each enquiry is worth ${R.vals[0] ? inrP(R.newRev / R.vals[0]) : "-"} today.` + (R.leakIdx >= 0 ? ` Biggest leak: ${R.convNames[R.leakIdx]}, ${inrP(R.gain[R.leakIdx])} a month.` : ""), 9, "muted");

  // Opportunities
  heading("Ranked revenue opportunities", "per month / per year");
  table(["#", "Opportunity", "Problem", "Per month", "Per year"],
    R.active.map((o, i) => [String(i + 1), o.t, o.diag, inrP(o.m), inrP(o.m * 12)]), {
      columnStyles: { 0: { cellWidth: 8, fontStyle: "bold", textColor: C.accent }, 1: { fontStyle: "bold" }, 3: { halign: "right", textColor: C.money, fontStyle: "bold" }, 4: { halign: "right" } },
      didParseCell: h => { if (h.section === "body" && h.row.index === 0) h.cell.styles.fillColor = C.soft; },
    });
  para("Ranked on revenue potential, confidence in the evidence, cost, speed to results, difficulty and whether the clinic has capacity to deliver. 'More qualified enquiries' needs new marketing spend and is not counted in recoverable revenue.", 8.5, "muted");

  // Database
  heading("Revenue inside the existing database", "one-time pool");
  const db = s.db;
  table(["Source", "Patients", "Assumption", "Value"], [
    ["Inactive patients returning", fmtN(db.inactive), `${db.reactRate || 0}% x ${inrP(db.retVal)}`, inrP(R.dbReact)],
    ["Overdue recalls booking", fmtN(db.overdue), `${db.recallRate || 0}% x ${inrP(db.retVal)}`, inrP(R.dbRecall)],
    ["Pending and incomplete treatments", fmtN(n(db.pending) + n(db.incomplete)), `${db.pendRate || 0}% x ${inrP(R.atv)}`, inrP(R.dbPending)],
    ["Total", "", "", inrP(R.dbPool)],
  ], { columnStyles: { 1: { halign: "right" }, 3: { halign: "right", fontStyle: "bold" } }, didParseCell: h => { if (h.section === "body" && h.row.index === 3) { h.cell.styles.fillColor = C.moneySoft; h.cell.styles.fontStyle = "bold"; } } });

  // Treatments
  const tx = R.tx.filter(t => t.c > 0 || t.st > 0);
  if (tx.length) {
    heading("High-value treatment mix", `+${s.hvLift || 0} points acceptance tested`);
    table(["Treatment", "Consults", "Starts", "Acceptance", "Revenue / mo", "If lifted"],
      tx.map(t => [t.name, fmtN(t.c), fmtN(t.st), pct(t.acc), inrP(t.rev), t.extra ? "+" + inrP(t.extra) : "-"]),
      { columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right", textColor: C.money } } });
  }

  // Capacity + systems
  heading("Capacity and current systems");
  const capText = { under: "Chairs are under-used, so the clinic can absorb more demand.", balanced: "Chairs are moderately used. Fix conversion before buying more leads.", full: "Chairs are full. Growth should come from revenue per patient, treatment mix and off-peak slots.", unknown: "Capacity was not captured." }[R.capVerdict];
  para(`Chair utilisation ${pct(R.util)} (${fmtN(s.capacity.booked)} of ${fmtN(R.slots)} appointment slots a month). ${capText}`, 10);
  const sysRows = SYSTEMS.filter(([k]) => s.systems[k]).map(([k, l]) => [l, STATE_LABEL[s.systems[k]]]);
  if (sysRows.length) {
    const half = Math.ceil(sysRows.length / 2);
    const rows = Array.from({ length: half }, (_, i) => [...sysRows[i], ...(sysRows[i + half] || ["", ""])]);
    const tint = h => { if (h.section === "body" && (h.column.index === 1 || h.column.index === 3)) { const v = h.cell.raw; h.cell.styles.fontStyle = "bold"; h.cell.styles.textColor = v === "None" ? C.leak : v === "Manual" ? C.money : C.accent; } };
    table(["Patient journey step", "Today", "Patient journey step", "Today"], rows, { didParseCell: tint });
  }
  if (s.tried) para("Already tried: " + s.tried, 9, "muted");

  // Plan
  heading("The plan");
  const capture = n(d.capture) / 100;
  if (R.top) {
    [["Bottleneck", R.top.why], ["Solution", R.top.pc + "."],
     ["Expected outcome", `Recovering ${pct(capture)} of the opportunity in the first 90 days: about ${inrP(R.top.m * capture)} a month from ${R.top.t.toLowerCase()}, and ${inrP(R.totalCons * capture)} a month across all recoverable opportunities.`]]
      .forEach(([k, v]) => {
        doc.setFont("helvetica", "normal"); doc.setFontSize(10);
        const lines = doc.splitTextToSize(P(v), CW - 38); ensure(lines.length * 4.4 + 4);
        doc.setFont("helvetica", "bold"); doc.setFontSize(8); color("accent"); doc.text(k.toUpperCase(), M, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); color("ink"); doc.text(lines, M + 38, y);
        y += lines.length * 4.4 + 3;
      });
  }
  const NEXT = { call2: "Revenue opportunity review (Call 2)", pilot: "Start a pilot", proposal: "Proposal to follow", data: "Clinic to share additional data", nofit: "Revisit at a later date" };
  y += 2;
  const nextLine = `${NEXT[d.next] || "-"}${d.when ? " on " + d.when : ""}${d.who ? ", with " + d.who : ""}.`;
  doc.setFont("helvetica", "bold"); doc.setFontSize(8); color("accent"); ensure(10); doc.text("NEXT STEP", M, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); color("ink"); doc.text(doc.splitTextToSize(P(nextLine), CW - 38), M + 38, y);
  y += 10;
  para("Figures are estimates built from numbers shared by the clinic during the diagnostic call and the assumptions shown. They indicate the size of each opportunity and are not a guarantee of results.", 8, "muted");

  // Footer on every page
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, 287, W - M, 287);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); color("muted");
    doc.text("PatientCurve - Revenue Intelligence  |  Find money first.", M, 291.5);
    doc.text(`${P(c.name || "Clinic")}  |  Page ${i} of ${pages}`, W - M, 291.5, { align: "right" });
  }
  return doc;
}

function reportFilename() {
  const name = (S().clinic.name || "Clinic").replace(/^Sample:\s*/, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "Clinic";
  return `PatientCurve-Revenue-Report-${name}-${S().clinic.date || new Date().toISOString().slice(0, 10)}.pdf`;
}

let reportBusy = false;
async function downloadReport(btn) {
  if (reportBusy) return;
  if (!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable) { toast("Report library did not load. Check the connection and reload."); return; }
  reportBusy = true; const label = btn.textContent; btn.textContent = "Preparing…"; btn.disabled = true;
  try {
    R = calc(S());
    const doc = buildReportPdf(), filename = reportFilename();
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data: doc.output("blob") }); toast("Report saved"); }
      catch (e) {
        const code = e && e.code;
        if (code === "declined") toast("Download cancelled");
        else if (code === "rate_limited") toast("A save prompt is already open");
        else { doc.save(filename); }
      }
    } else {
      doc.save(filename); toast("Report downloaded");
    }
  } catch (e) {
    toast("Could not build the report: " + (e && e.message ? e.message : "unknown error"));
  } finally { reportBusy = false; btn.textContent = label; btn.disabled = false; }
}

/* Boot */
load();
store.step = Math.min(Math.max(0, n(store.step)), STEPS.length - 1);
renderAll();
